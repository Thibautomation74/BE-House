# ===================================================================
# Reglages generaux. Les criteres de recherche sont dans zones/*.yaml
# ===================================================================

# Fenetre d'affichage : la page montre les annonces des N derniers
# jours, la plus fraiche en tete. Au-dela, elles sont oubliees.
retention_days: 7

# Adresse publique de la page, reprise en bas du mail quotidien.
page_url: https://thibautomation74.github.io/BE-House/

# ===================================================================
# Boite de collecte. L'adresse et le mot de passe vivent dans les
# secrets GitHub IMAP_USER et IMAP_PASSWORD : le depot etant public,
# rien de personnel ne doit figurer ici.
# ===================================================================
imap:
  host: imap.gmail.com          # iCloud : imap.mail.me.com
  user: ""                      # vide = valeur du secret IMAP_USER
  folder: INBOX

  # 50h et non 26 : si GitHub saute une journee de planification, le
  # passage du lendemain rattrape les alertes manquees. Le magasin
  # dedoublonne, relire deux fois est sans consequence.
  lookback_hours: 50

  # Liste VIDE = tous les expediteurs acceptes. La boite est dediee, elle
  # ne recoit que des alertes : filtrer sur l’expediteur ne ferait qu’ecarter
  # en silence une agence ajoutee plus tard. Le tri se fait sur le contenu.
  senders: []

  # Conserve a titre indicatif — decommenter pour restreindre :
  # senders_exemple:
  #   - immoweb
  #   - zimmo
  #   - immovlan
  #   - immoscoop
  #   - realo
  #   - logic-immo
  #   - biddit
  #   - era.be
  #   - century21
  #   - trevi
  #   - weinvest
  #   - easyimmo

# ===================================================================
# Digest quotidien par mail. Desactive : la page est le seul canal.
# ===================================================================
notify:
  enabled: false

  to:
    - maisonrecherchebe@gmail.com

  smtp_host: smtp.gmail.com     # iCloud : smtp.mail.me.com, port 587
  smtp_port: 465

  # false = pas de mail les matins sans nouveaute.
  send_when_empty: false
