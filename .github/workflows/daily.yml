name: Veille immo quotidienne

on:
  schedule:
    # GitHub Actions tourne en UTC, et ses taches planifiees sont en
    # "meilleur effort" : une demande pile a l'heure ronde subit la charge
    # maximale et peut etre retardee de 30 min, voire abandonnee. On decale
    # donc a la minute 17, largement moins encombree.
    #
    # Trois declenchements pour obtenir des passages locaux a 7h et 8h
    # quelle que soit la saison :
    #   ete  (UTC+2) : 05h17->07h17, 06h17->08h17, 07h17->09h17
    #   hiver(UTC+1) : 05h17->06h17, 06h17->07h17, 07h17->08h17
    # collect.py accepte les heures locales 7, 8 et 9 : cette tolerance
    # absorbe les retards de GitHub sans multiplier les passages inutiles.
    - cron: "17 5 * * *"
    - cron: "17 6 * * *"
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignorer le controle d'heure"
        default: "1"

permissions:
  contents: write

concurrency:
  group: veille-immo
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collecter les annonces
        env:
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FORCE: ${{ github.event.inputs.force }}
        run: python collect.py

      - name: Publier le resultat
        run: |
          git config user.name "veille-immo"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "Annonces du $(date +%F)"
          git push
