name: Veille immo quotidienne

on:
  # --- Declencheur externe (fiable) --------------------------------
  # Le cron de GitHub Actions est en "meilleur effort" : sa propre
  # documentation prevoit que des executions soient retardees ou
  # abandonnees en periode de charge. Un service de cron tiers appelle
  # donc l'API GitHub chaque matin, ce qui rend le declenchement sur.
  repository_dispatch:
    types: [veille]

  # --- Cron GitHub (filet de secours) ------------------------------
  # Conserve : quand il fonctionne, il evite de dependre du tiers.
  # Minute 17 plutot que l'heure ronde, moins encombree.
  #   ete  (UTC+2) : 05h17->07h17, 06h17->08h17, 07h17->09h17
  #   hiver(UTC+1) : 05h17->06h17, 06h17->07h17, 07h17->08h17
  schedule:
    - cron: "17 5 * * *"
    - cron: "17 6 * * *"
    - cron: "17 7 * * *"

  # --- Bouton manuel -----------------------------------------------
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille-immo
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collecter les annonces
        env:
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # Seul le cron GitHub subit le controle d'heure. Un appel
          # externe ou manuel s'execute immediatement : c'est
          # l'appelant qui decide de l'horaire.
          FORCE: ${{ github.event_name != 'schedule' && '1' || '' }}
        run: python collect.py

      - name: Publier le resultat
        run: |
          git config user.name "veille-immo"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "Annonces du $(date +%F)"
          git push
