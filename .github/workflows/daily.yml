name: Veille immo quotidienne

on:
  schedule:
    # GitHub Actions tourne en UTC. Trois declenchements pour obtenir deux
    # passages locaux (7h et 8h) quelle que soit l'heure d'ete ou d'hiver :
    #   ete  (UTC+2) : 05h->07h, 06h->08h, 07h->09h ignore
    #   hiver(UTC+1) : 05h->06h ignore, 06h->07h, 07h->08h
    # collect.py verifie l'heure locale et ignore les passages hors creneau.
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignorer le controle d'heure"
        default: "1"

permissions:
  contents: write

concurrency:
  group: veille-immo
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collecter les annonces
        env:
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FORCE: ${{ github.event.inputs.force }}
        run: python collect.py

      - name: Publier le resultat
        run: |
          git config user.name "veille-immo"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "Annonces du $(date +%F)"
          git push
