name: Veille immo quotidienne

on:
  schedule:
    # GitHub Actions tourne en UTC. On declenche a 05:00 et 06:00 UTC :
    # l'un des deux correspond a 07:00 a Bruxelles selon l'heure d'ete/hiver.
    # collect.py verifie l'heure locale reelle et ignore la mauvaise execution.
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignorer le controle d'heure"
        default: "1"

permissions:
  contents: write

concurrency:
  group: veille-immo
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collecter les annonces
        env:
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          FORCE: ${{ github.event.inputs.force }}
        run: python collect.py

      - name: Publier le resultat
        run: |
          git config user.name "veille-immo"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "Annonces du $(date +%F)"
          git push
