# Aucun tri. Les alertes des portails filtrent deja ; le script se contente
# de lire, nettoyer, dedoublonner et afficher ce qui arrive.
#
# Chaque champ vide ou null desactive le controle correspondant. Pour
# reactiver un filtre un jour, il suffit de lui redonner une valeur.
criteria:
  label: Maisons à voir
  subtitle: Toutes les annonces reçues des portails et des agences

  # --- Aucun rejet -------------------------------------------------
  price_max: null               # aucune limite de prix
  price_min: null
  zipcode_ranges: []            # aucune restriction geographique
  zipcode_exclude: []
  exclude_keywords: []          # aucun mot ecarte

  # --- Reperes d'affichage : n'excluent rien -----------------------
  # Ces seuils servent uniquement a poser une pastille rouge sur les
  # fiches qui s'en ecartent, et a placer le repere de la jauge de
  # terrain. L'annonce reste visible dans tous les cas.
  soft:
    - bedrooms_min
    - bathrooms_min
    - facades_min
    - land_min

  bedrooms_min: 3
  bathrooms_min: 1
  facades_min: 3
  land_min: 500

  reference_price_per_sqm: null

  # Rappels ambres sur chaque fiche : non automatisables, a controler
  # sur les photos avant de se deplacer.
  always_verify:
    - "cuisine ouverte"
    - "pas de pierre apparente à l'intérieur"
    - "environnement calme"
